<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="kite-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#ADFF2F" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <path d="M 50,5 L 95,50 L 50,95 L 5,50 Z" fill="url(#kite-gradient)" stroke="black" stroke-width="2" />

  <!-- Cross -->
  <line x1="50" y1="5" x2="50" y2="95" stroke="black" stroke-width="2" />
  <line x1="5" y1="50" x2="95" y2="50" stroke="black" stroke-width="2" />

  <!-- Tail -->
  <path d="M 50,95 C 40,110 60,110 50,120 C 40,130 60,130 50,140" stroke="black" stroke-width="2" fill="none" />
  <circle cx="45" cy="115" r="5" fill="#FF4500" />
  <circle cx="55" cy="125" r="5" fill="#FFD700" />
  <circle cx="45" cy="135" r="5" fill="#ADFF2F" />
</svg>

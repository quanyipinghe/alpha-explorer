<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="fish-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4682B4" />
      <stop offset="80%" stop-color="#4169E1" />
      <stop offset="100%" stop-color="#0000CD" />
    </radialGradient>
  </defs>
  
  <!-- Body -->
  <path d="M 20,50 C 60,20 80,80 20,50 Z" fill="url(#fish-gradient)" />

  <!-- Tail -->
  <path d="M 80,50 C 90,40 90,60 80,50 Z" fill="#4169E1" />

  <!-- Eye -->
  <circle cx="30" cy="45" r="3" fill="white" />
  <circle cx="30" cy="45" r="1.5" fill="black" />

  <!-- Fins -->
  <path d="M 40,60 C 30,70 50,70 40,60 Z" fill="#4169E1" />
  <path d="M 50,40 C 40,30 60,30 50,40 Z" fill="#4169E1" />

  <!-- Bubbles -->
  <circle cx="85" cy="35" r="3" fill="white" opacity="0.5" />
  <circle cx="90" cy="45" r="2" fill="white" opacity="0.5" />
</svg>

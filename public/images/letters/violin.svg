<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="violin-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2B48C" />
      <stop offset="100%" stop-color="#8B4513" />
    </linearGradient>
  </defs>
  
  <!-- Body -->
  <path d="M 30,10 C 10,30 10,70 30,90 L 70,90 C 90,70 90,30 70,10 Z" fill="url(#violin-gradient)" />

  <!-- Neck -->
  <rect x="45" y="10" width="10" height="30" fill="#8B4513" />

  <!-- Strings -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="black" stroke-width="1" />
  <line x1="45" y1="20" x2="45" y2="80" stroke="black" stroke-width="1" />
  <line x1="55" y1="20" x2="55" y2="80" stroke="black" stroke-width="1" />

  <!-- F-holes -->
  <path d="M 35,50 C 30,60 40,60 35,70" stroke="black" stroke-width="2" fill="none" />
  <path d="M 65,50 C 70,60 60,60 65,70" stroke="black" stroke-width="2" fill="none" />
</svg>

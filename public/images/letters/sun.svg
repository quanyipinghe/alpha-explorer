<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sun-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </radialGradient>
  </defs>
  
  <!-- Body -->
  <circle cx="50" cy="50" r="30" fill="url(#sun-gradient)" />

  <!-- Rays -->
  <g transform="translate(50,50)" stroke="#FFA500" stroke-width="5" stroke-linecap="round">
    <line transform="rotate(0)" y1="-35" y2="-45" />
    <line transform="rotate(30)" y1="-35" y2="-45" />
    <line transform="rotate(60)" y1="-35" y2="-45" />
    <line transform="rotate(90)" y1="-35" y2="-45" />
    <line transform="rotate(120)" y1="-35" y2="-45" />
    <line transform="rotate(150)" y1="-35" y2="-45" />
    <line transform="rotate(180)" y1="-35" y2="-45" />
    <line transform="rotate(210)" y1="-35" y2="-45" />
    <line transform="rotate(240)" y1="-35" y2="-45" />
    <line transform="rotate(270)" y1="-35" y2="-45" />
    <line transform="rotate(300)" y1="-35" y2="-45" />
    <line transform="rotate(330)" y1="-35" y2="-45" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="watch-strap-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4A4A" />
      <stop offset="100%" stop-color="#2C2C2C" />
    </linearGradient>
  </defs>
  
  <!-- Strap -->
  <rect x="10" y="40" width="80" height="20" fill="url(#watch-strap-gradient)" />

  <!-- Case -->
  <circle cx="50" cy="50" r="25" fill="#F5F5F5" stroke="black" stroke-width="2" />

  <!-- Hands -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="black" stroke-width="3" />
  <line x1="50" y1="50" x2="65" y2="50" stroke="black" stroke-width="2" />

  <!-- Crown -->
  <rect x="75" y="45" width="5" height="10" fill="#2C2C2C" />
</svg>

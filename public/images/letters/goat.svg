<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="goat-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D2B48C" />
      <stop offset="80%" stop-color="#BC8F8F" />
      <stop offset="100%" stop-color="#8B4513" />
    </radialGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="50" cy="50" r="25" fill="url(#goat-gradient)" />

  <!-- Horns -->
  <path d="M 40,25 C 30,15 40,5 50,15 Z" fill="#8B4513" />
  <path d="M 60,25 C 70,15 60,5 50,15 Z" fill="#8B4513" />

  <!-- Ears -->
  <path d="M 25,50 C 15,40 15,60 25,50 Z" fill="#BC8F8F" />
  <path d="M 75,50 C 85,40 85,60 75,50 Z" fill="#BC8F8F" />

  <!-- Eyes -->
  <circle cx="40" cy="45" r="4" fill="white" />
  <circle cx="60" cy="45" r="4" fill="white" />
  <rect x="38" y="44" width="4" height="2" fill="black" />
  <rect x="58" y="44" width="4" height="2" fill="black" />

  <!-- Nose -->
  <circle cx="50" cy="55" r="3" fill="black" />

  <!-- Beard -->
  <path d="M 45,70 C 40,80 50,85 50,70 Z" fill="#8B4513" />
</svg>

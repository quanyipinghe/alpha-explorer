<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="monkey-face-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F5DEB3" />
      <stop offset="100%" stop-color="#DEB887" />
    </radialGradient>
    <radialGradient id="monkey-body-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A0522D" />
      <stop offset="100%" stop-color="#8B4513" />
    </radialGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="50" cy="40" r="30" fill="url(#monkey-body-gradient)" />

  <!-- Face -->
  <circle cx="50" cy="45" r="20" fill="url(#monkey-face-gradient)" />

  <!-- Ears -->
  <circle cx="20" cy="40" r="10" fill="url(#monkey-body-gradient)" />
  <circle cx="80" cy="40" r="10" fill="url(#monkey-body-gradient)" />

  <!-- Eyes -->
  <circle cx="40" cy="40" r="4" fill="black" />
  <circle cx="60" cy="40" r="4" fill="black" />

  <!-- Mouth -->
  <path d="M 40,55 C 45,60 55,60 60,55" stroke="black" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Body -->
  <path d="M 30,70 C 20,100 80,100 70,70 Z" fill="url(#monkey-body-gradient)" />
</svg>

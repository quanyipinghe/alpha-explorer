<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="pig-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFC0CB" />
      <stop offset="100%" stop-color="#FFB6C1" />
    </radialGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="50" cy="50" r="30" fill="url(#pig-gradient)" />

  <!-- Ears -->
  <path d="M 30,25 C 20,15 40,20 30,25 Z" fill="#FFB6C1" />
  <path d="M 70,25 C 80,15 60,20 70,25 Z" fill="#FFB6C1" />

  <!-- Eyes -->
  <circle cx="40" cy="45" r="4" fill="white" />
  <circle cx="60" cy="45" r="4" fill="white" />
  <circle cx="40" cy="45" r="2" fill="black" />
  <circle cx="60" cy="45" r="2" fill="black" />

  <!-- Snout -->
  <ellipse cx="50" cy="60" rx="15" ry="10" fill="#FFB6C1" />
  <circle cx="45" cy="60" r="3" fill="black" />
  <circle cx="55" cy="60" r="3" fill="black" />
</svg>

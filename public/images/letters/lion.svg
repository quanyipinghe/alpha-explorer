<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="lion-face-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </radialGradient>
    <radialGradient id="mane-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="70%" stop-color="#D2691E" />
      <stop offset="100%" stop-color="#8B4513" />
    </radialGradient>
  </defs>
  
  <!-- Mane -->
  <circle cx="50" cy="50" r="45" fill="url(#mane-gradient)" />

  <!-- Head -->
  <circle cx="50" cy="50" r="30" fill="url(#lion-face-gradient)" />

  <!-- Ears -->
  <circle cx="30" cy="25" r="10" fill="#FFA500" />
  <circle cx="70" cy="25" r="10" fill="#FFA500" />

  <!-- Eyes -->
  <circle cx="40" cy="45" r="5" fill="white" />
  <circle cx="60" cy="45" r="5" fill="white" />
  <circle cx="40" cy="45" r="2" fill="black" />
  <circle cx="60" cy="45" r="2" fill="black" />

  <!-- Nose -->
  <path d="M 48,55 L 52,55 L 50,60 Z" fill="black" />

  <!-- Mouth -->
  <path d="M 40,65 C 45,70 55,70 60,65" stroke="black" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>

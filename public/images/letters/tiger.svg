<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="tiger-gradient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF8C00" />
    </radialGradient>
  </defs>
  
  <!-- Head -->
  <circle cx="50" cy="50" r="30" fill="url(#tiger-gradient)" />

  <!-- Ears -->
  <circle cx="30" cy="25" r="10" fill="#FF8C00" />
  <circle cx="70" cy="25" r="10" fill="#FF8C00" />

  <!-- Eyes -->
  <circle cx="40" cy="45" r="5" fill="white" />
  <circle cx="60" cy="45" r="5" fill="white" />
  <circle cx="40" cy="45" r="2" fill="black" />
  <circle cx="60" cy="45" r="2" fill="black" />

  <!-- Nose -->
  <path d="M 48,55 L 52,55 L 50,60 Z" fill="black" />

  <!-- Stripes -->
  <path d="M 20,40 C 25,30 35,30 40,40" stroke="black" stroke-width="3" fill="none" />
  <path d="M 80,40 C 75,30 65,30 60,40" stroke="black" stroke-width="3" fill="none" />
  <path d="M 25,60 C 30,70 40,70 45,60" stroke="black" stroke-width="3" fill="none" />
  <path d="M 75,60 C 70,70 60,70 55,60" stroke="black" stroke-width="3" fill="none" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="juice-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
    <linearGradient id="glass-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </linearGradient>
  </defs>
  
  <!-- Glass -->
  <rect x="25" y="20" width="50" height="70" rx="5" fill="url(#glass-gradient)" stroke="rgba(255,255,255,0.5)" stroke-width="2" />

  <!-- Juice -->
  <rect x="30" y="30" width="40" height="55" fill="url(#juice-gradient)" />

  <!-- Straw -->
  <line x1="60" y1="10" x2="70" y2="40" stroke="#FF4500" stroke-width="5" />

  <!-- Lemon Slice -->
  <circle cx="25" cy="30" r="10" fill="#FFD700" />
  <circle cx="25" cy="30" r="8" fill="#FFA500" />
  <path d="M 25,22 V 38 M 17,30 H 33" stroke="white" stroke-width="1" />
</svg>

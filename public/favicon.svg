<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81D4FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:1" />
    </linearGradient>
    <style>
      .letter {
        font-family: 'Varela Round', sans-serif, Arial, sans-serif;
        font-weight: bold;
        fill: white;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg-gradient)" />

  <!-- Letters -->
  <text x="30" y="35" font-size="38" class="letter" fill="#FFC107">A</text>
  <text x="70" y="35" font-size="38" class="letter" fill="#4CAF50">B</text>
  <text x="50" y="75" font-size="38" class="letter" fill="#F44336">C</text>
</svg>
